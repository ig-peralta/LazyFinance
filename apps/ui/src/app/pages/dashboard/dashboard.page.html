<div class="max-w-2xl">
  <p class="text-xs font-semibold uppercase tracking-[0.18em] text-primary">
    Hola, {{ session.user()?.name }}
  </p>
  <h1 class="mt-4 text-4xl font-semibold tracking-[-0.05em] text-color-emphasis sm:text-5xl">
    Tu dinero, más claro.
  </h1>
  <p class="mt-4 text-base leading-7 text-muted-color">
    Un vistazo a tus finanzas de demostración.
  </p>
</div>

<dashboard-account class="block" />
<dashboard-summary class="block" />
<dashboard-comparison class="block" />
<dashboard-objective class="block" />
<dashboard-budget-progress class="block" />
<dashboard-activity class="block" (tagChanged)="refreshAfterTagDecision()" />
