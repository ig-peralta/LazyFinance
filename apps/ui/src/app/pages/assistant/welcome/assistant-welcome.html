<div class="chat-welcome">
  <h2>¿Qué revisamos{{ name() ? ', ' + name() : '' }}?</h2>
  <div class="suggestion-grid">
    @for (suggestion of suggestions; track suggestion.title) {
      <button type="button" class="suggestion" [title]="suggestion.question" [attr.aria-label]="suggestion.title + ': ' + suggestion.question" [disabled]="busy()" (click)="choose.emit(suggestion.question)">
        <app-icon [name]="suggestion.icon" /><strong>{{ suggestion.title }}</strong>
      </button>
    }
  </div>
  <p class="welcome-note">Los cambios siempre necesitan tu aprobación.</p>
</div>
