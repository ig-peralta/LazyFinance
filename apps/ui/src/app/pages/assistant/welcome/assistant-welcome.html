<div class="chat-welcome">
  <h2>¿Qué revisamos{{ name() ? ', ' + name() : '' }}?</h2>
  @if (voiceAvailable()) {
    <div class="welcome-voice">
      <button type="button" class="welcome-voice-start" aria-label="Iniciar conversación por voz" [disabled]="busy() || !voiceReady()" (click)="startVoice.emit()"><span class="welcome-microphone" aria-hidden="true"><app-icon name="microphone" /></span><span><strong>Conversar por voz</strong><small>Cuéntame qué tienes en mente</small></span><app-icon name="arrow" /></button>
      <p>Sin escribir, en una sesión de voz separada.</p>
    </div>
  }
  <div class="suggestion-grid">
    @for (suggestion of suggestions; track suggestion.title) {
      <button type="button" class="suggestion" [title]="suggestion.question" [attr.aria-label]="suggestion.title + ': ' + suggestion.question" [disabled]="busy()" (click)="choose.emit(suggestion.question)">
        <app-icon [name]="suggestion.icon" /><strong>{{ suggestion.title }}</strong>
      </button>
    }
  </div>
  <p class="welcome-note">Los cambios siempre necesitan tu aprobación.</p>
</div>
