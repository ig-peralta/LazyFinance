<p class="panel-subtitle">{{ source().name }} · un plan con fecha, no un ingreso recibido.</p>
@if (command.error() || error()) { <p class="notice danger" role="alert">{{ error() || command.error() }}</p> }
<form (ngSubmit)="save()"><fieldset [disabled]="command.pending()" class="form-fieldset"><div class="form-grid"><div class="field"><label for="expectation-date">Fecha esperada</label><input id="expectation-date" name="date" type="date" [(ngModel)]="date" [min]="source().startDate" [max]="source().endDate" required /></div><div class="field"><label for="expectation-amount">Monto esperado (CLP)</label><input id="expectation-amount" name="amount" inputmode="decimal" [(ngModel)]="amount" placeholder="150000" required /></div><label class="check-option field full"><input type="checkbox" name="estimate" [(ngModel)]="estimate" /> Es una estimación, no un monto cierto.</label></div></fieldset><div class="form-actions"><button class="button" type="button" (click)="cancelled.emit()">Cancelar</button><button class="button primary" type="submit" [disabled]="command.pending()">{{ command.pending() ? 'Guardando…' : entry() ? 'Guardar pago esperado' : 'Añadir pago esperado' }}</button></div></form>
