<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>LazyFinance — Entiende mejor tu dinero</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Haz preguntas sobre tu dinero y obtén análisis claros sobre tus gastos, tus metas de ahorro y lo que viene."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root>
      <!-- Static copy of WorkspaceLoading: visible before Angular/Firebase downloads. -->
      <main class="workspace-loading">
        <section class="workspace-loading-content" aria-label="LazyFinance">
          <svg class="workspace-loading-logo" width="64" height="64" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="currentColor" /><path d="m10 26 8-8 5 5 9-12m-8 0h8v8" fill="none" stroke="#05251b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <strong class="workspace-loading-brand">LazyFinance<span>.</span></strong>
          <div class="workspace-loading-message"><div role="status" aria-live="polite" aria-atomic="true"><h1>Preparando tu espacio</h1><p>Estamos preparando tu sesión y tus datos.</p></div></div>
          <div class="workspace-loading-progress" aria-hidden="true"><span></span></div>
        </section>
        <p class="workspace-loading-footnote">Tus finanzas, con calma y claridad.</p>
      </main>
    </app-root>
  </body>
</html>
