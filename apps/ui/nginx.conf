server {
    listen 4000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # API requests use their configured origin, never the UI's SPA fallback.
    location /api/ { return 404; }
    location = /api { return 404; }

    # Only fingerprinted build assets may be cached indefinitely.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(js|css|map|woff2?|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ /index.csr.html;
        add_header Cache-Control "no-cache";
    }
}
