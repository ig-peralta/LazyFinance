name: lazyfinance-apps

services:
  api:
    container_name: lazyfinance-api
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: '3000'
      POSTGRES_URL: postgresql://user:password@postgres:5432/postgres
      CORS_ORIGINS: '${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}'
      AUTH_PROVIDER: '${AUTH_PROVIDER:-mock}'
      FIREBASE_PROJECT_ID:
      FIREBASE_CLIENT_EMAIL:
      FIREBASE_PRIVATE_KEY:
    ports:
      - '3000:3000'
    networks:
      - lazyfinance
    restart: unless-stopped

  ui:
    container_name: lazyfinance-ui
    build:
      context: ../..
      dockerfile: apps/ui/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '4000'
      API_INTERNAL_URL: http://api:3000
    ports:
      - '4200:4000'
    networks:
      - lazyfinance
    restart: unless-stopped

networks:
  lazyfinance:
    external: true
